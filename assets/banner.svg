<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orbit-path {
        animation: floatNode 8s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 8;
        animation: dash 20s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      }
      @keyframes floatNode {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle cx="150" cy="80" r="160" fill="url(#glowGrad1)" class="pulse-circle" />
    <circle cx="1050" cy="320" r="180" fill="url(#glowGrad2)" class="pulse-circle" style="animation-delay: -2s;" />
  </g>

  <!-- Dynamic Flow Connector Lines (Background) -->
  <g stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" fill="none">
    <path class="stream-line" d="M -50,300 C 300,380 400,30 800,100 C 1000,150 1100,80 1250,120" />
    <path class="stream-line" d="M -50,100 C 250,20 500,250 850,350 C 1050,400 1150,250 1250,320" style="animation-duration: 28s;" />
  </g>

  <!-- Floating Decorative Nodes/Cards (Behind text and at sides) -->
  <g class="orbit-path" opacity="0.65">
    <!-- Left Top Card -->
    <g transform="translate(80, 50)">
      <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="22" cy="20" r="6" fill="#38bdf8" />
      <text x="36" y="24" class="badge-text">⚡ Automation</text>
    </g>

    <!-- Right Top Card -->
    <g transform="translate(980, 60)">
      <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="22" cy="20" r="6" fill="#c084fc" />
      <text x="36" y="24" class="badge-text">🧠 Knowledge</text>
    </g>

    <!-- Left Bottom Card -->
    <g transform="translate(70, 310)">
      <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="22" cy="20" r="6" fill="#818cf8" />
      <text x="36" y="24" class="badge-text">👥 Team Collab</text>
    </g>

    <!-- Right Bottom Card -->
    <g transform="translate(990, 290)">
      <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <circle cx="22" cy="20" r="6" fill="#34d399" />
      <text x="36" y="24" class="badge-text">🛡️ Sovereign</text>
    </g>
  </g>

  <!-- Central Foreground Content Container -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Pill Badge -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="-64" class="badge-text" fill="#a5b4fc" text-anchor="middle">✨ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="-10" class="title">
      Awesome Business Utility &amp; Productivity
    </text>

    <!-- Gradient Bar Accent -->
    <rect x="-160" y="8" width="320" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle">
      Top SaaS Platforms &amp; Self-Hosted Open-Source Software Tools
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 80)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="19" class="badge-text" text-anchor="middle">⚡ Workflow Automation</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="80" y="19" class="badge-text" text-anchor="middle">📊 Database &amp; PM</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82" y="19" class="badge-text" text-anchor="middle">🔐 Security &amp; Identity</text>
      </g>
    </g>
  </g>
</svg>
